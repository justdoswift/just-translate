<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Just Translate · 设置</title>
    <link rel="icon" type="image/png" href="/icon/32.png" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div class="brand">
          <img src="/icon/128.png" width="48" height="48" alt="" />
          <div>
            <h1>Just Translate</h1>
            <p>翻译设置</p>
          </div>
        </div>
        <div class="header-meta">
          <span class="version">v<span id="version"></span></span>
          <span id="connection-state" class="state" role="status">读取配置中</span>
        </div>
      </header>
      <main>
        <section
          id="startup-error"
          class="startup-error"
          role="alert"
          aria-labelledby="startup-error-title"
          hidden
        >
          <h2 id="startup-error-title">上次翻译未能启动</h2>
          <p id="startup-error-message"></p>
        </section>
        <form id="settings-form" autocomplete="off">
          <fieldset id="settings-fields" disabled>
            <section class="section" aria-labelledby="connection-title">
              <h2 id="connection-title">模型连接</h2>
              <div class="section-body">
                <fieldset class="provider-picker">
                  <legend>服务商</legend>
                  <div class="provider-options">
                    <label class="provider-option"
                      ><input
                        type="radio"
                        name="provider"
                        value="deepseek"
                        checked
                      /><span>DeepSeek</span></label
                    ><label class="provider-option"
                      ><input
                        type="radio"
                        name="provider"
                        value="custom"
                      /><span>OpenAI 兼容</span></label
                    >
                  </div>
                </fieldset>
                <div class="field-grid">
                  <label class="field"
                    >API 基础地址<input
                      id="base-url"
                      type="url"
                      required
                      spellcheck="false"
                      placeholder="https://api.deepseek.com"
                  /></label>
                  <label class="field"
                    >模型名称<input
                      id="model"
                      type="text"
                      required
                      maxlength="150"
                      spellcheck="false"
                      placeholder="deepseek-flash"
                  /></label>
                </div>
                <label class="field" for="api-key">API Key</label>
                <div class="key-field">
                  <input
                    id="api-key"
                    type="password"
                    spellcheck="false"
                    autocomplete="off"
                    required
                    placeholder="输入你的 API Key"
                  /><button
                    id="show-key"
                    class="text-button"
                    type="button"
                    aria-controls="api-key"
                    aria-pressed="false"
                  >
                    显示
                  </button>
                </div>
                <label class="check-row"
                  ><input id="remember-key" type="checkbox" /><span
                    >在本机记住密钥</span
                  ></label
                >
                <details class="advanced">
                  <summary>接口兼容选项</summary>
                  <div class="detail-body">
                    <label class="check-row"
                      ><input id="json-mode" type="checkbox" /><span
                        >JSON 输出</span
                      ></label
                    ><label class="check-row"
                      ><input id="disable-thinking" type="checkbox" /><span
                        >关闭思考模式</span
                      ></label
                    >
                  </div>
                </details>
              </div>
            </section>
            <section class="section" aria-labelledby="reading-title">
              <h2 id="reading-title">阅读偏好</h2>
              <div class="section-body">
                <div class="reading-grid">
                  <label class="field"
                    >翻译为<select id="target-language"></select
                  ></label>
                  <fieldset class="display-picker">
                    <legend>显示方式</legend>
                    <div class="display-options">
                      <label class="display-option">
                        <input
                          id="display-bilingual"
                          type="radio"
                          name="displayMode"
                          value="bilingual"
                          checked
                        /><span>双语对照</span>
                      </label>
                      <label class="display-option">
                        <input
                          id="display-translation"
                          type="radio"
                          name="displayMode"
                          value="translation"
                        /><span>只显示译文</span>
                      </label>
                    </div>
                  </fieldset>
                </div>
                <label class="field language-field"
                  >最大并发请求<input
                    id="max-concurrent-requests"
                    type="number"
                    min="1"
                    max="8"
                    step="1"
                    required
                    inputmode="numeric"
                /></label>
                <button
                  id="configure-shortcut"
                  type="button"
                  class="button secondary"
                >
                  翻译快捷键
                </button>
              </div>
            </section>
            <section
              class="section section-disclosure"
              aria-labelledby="data-title"
            >
              <details class="advanced">
                <summary id="data-title">缓存与费用</summary>
                <div class="detail-body">
                  <label class="check-row"
                    ><input id="persistent-cache" type="checkbox" /><span
                      >持久缓存</span
                    ></label
                  >
                  <div class="field-grid">
                    <label class="field"
                      >缓存保留天数<input
                        id="cache-days"
                        type="number"
                        min="1"
                        max="30"
                        step="1"
                        required
                    /></label>
                    <label class="field"
                      >月度费用上限（USD）<input
                        id="monthly-budget"
                        type="number"
                        min="0"
                        max="10000"
                        step="0.01"
                        required
                    /></label>
                  </div>
                  <div class="field-grid">
                    <label class="field"
                      >输入价格 / 百万 token（USD）<input
                        id="input-price"
                        type="number"
                        min="0"
                        max="10000"
                        step="0.001"
                        required
                    /></label>
                    <label class="field"
                      >输出价格 / 百万 token（USD）<input
                        id="output-price"
                        type="number"
                        min="0"
                        max="10000"
                        step="0.001"
                        required
                    /></label>
                  </div>
                  <label class="field language-field"
                    >单页 token 上限<input
                      id="page-token-limit"
                      type="number"
                      min="0"
                      max="10000000"
                      step="1"
                      required
                  /></label>
                </div>
              </details>
            </section>
            <div id="settings-actions" class="actions">
              <p id="form-status" role="status" aria-live="polite"></p>
              <div class="action-buttons">
                <button
                  id="test-connection"
                  type="button"
                  class="button secondary"
                >
                  保存并测试</button
                ><button
                  id="save-settings"
                  type="submit"
                  class="button primary"
                >
                  保存设置
                </button>
              </div>
            </div>
          </fieldset>
        </form>
        <section class="usage-section" aria-labelledby="usage-title">
          <div class="usage-heading">
            <h2 id="usage-title">本月用量</h2>
            <button id="refresh-usage" type="button" class="text-button">
              刷新用量
            </button>
          </div>
          <dl class="usage-grid">
            <div>
              <dt>预计费用</dt>
              <dd id="usage-cost">—</dd>
            </div>
            <div>
              <dt>输入 / 输出 token</dt>
              <dd id="usage-tokens">—</dd>
            </div>
            <div>
              <dt>请求 / 缓存命中</dt>
              <dd id="usage-requests">—</dd>
            </div>
          </dl>
          <p id="usage-note" class="usage-status" role="status"></p>
          <div class="cache-actions">
            <span id="cache-count">—</span
            ><button id="clear-cache" type="button" class="text-button">
              清除译文缓存
            </button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
