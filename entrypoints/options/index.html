<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Just Translate · 设置</title>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <a class="brand" href="#"
          ><img src="/icon/48.png" width="36" height="36" alt="" /><span
            >Just Translate</span
          ></a
        >
        <span class="version">Chrome 扩展 <span id="version"></span></span>
      </header>
      <main>
        <div class="intro">
          <h1>翻译设置</h1>
          <span id="connection-state" class="state" role="status"
            >读取配置中</span
          >
        </div>
        <section
          id="startup-error"
          class="startup-error"
          role="alert"
          aria-labelledby="startup-error-title"
          hidden
        >
          <h2 id="startup-error-title">上次翻译未能启动</h2>
          <p id="startup-error-message"></p>
        </section>
        <form id="settings-form" autocomplete="off">
          <fieldset id="settings-fields" disabled>
            <section class="section" aria-labelledby="connection-title">
              <div class="section-heading">
                <span class="section-number" aria-hidden="true">01</span>
                <div>
                  <h2 id="connection-title">模型连接</h2>
                </div>
              </div>
              <div class="section-body">
                <fieldset class="provider-picker">
                  <legend>服务商</legend>
                  <div class="provider-options">
                    <label class="provider-option"
                      ><input
                        type="radio"
                        name="provider"
                        value="deepseek"
                        checked
                      /><span>DeepSeek</span></label
                    ><label class="provider-option"
                      ><input
                        type="radio"
                        name="provider"
                        value="custom"
                      /><span>OpenAI 兼容</span></label
                    >
                  </div>
                </fieldset>
                <div class="field-grid">
                  <label class="field"
                    >API 基础地址<input
                      id="base-url"
                      type="url"
                      required
                      spellcheck="false"
                      placeholder="https://api.deepseek.com"
                  /></label>
                  <label class="field"
                    >模型名称<input
                      id="model"
                      type="text"
                      required
                      maxlength="150"
                      spellcheck="false"
                      placeholder="deepseek-flash"
                  /></label>
                </div>
                <label class="field" for="api-key">API Key</label>
                <div class="key-field">
                  <input
                    id="api-key"
                    type="password"
                    spellcheck="false"
                    autocomplete="off"
                    required
                    placeholder="输入你的 API Key"
                  /><button
                    id="show-key"
                    class="text-button"
                    type="button"
                    aria-controls="api-key"
                    aria-pressed="false"
                  >
                    显示
                  </button>
                </div>
                <label class="check-row"
                  ><input id="remember-key" type="checkbox" /><span
                    >在本机记住密钥</span
                  ></label
                >
                <details class="advanced">
                  <summary>接口兼容选项</summary>
                  <div class="detail-body">
                    <label class="check-row"
                      ><input id="json-mode" type="checkbox" /><span
                        >JSON 输出</span
                      ></label
                    ><label class="check-row"
                      ><input id="disable-thinking" type="checkbox" /><span
                        >关闭思考模式</span
                      ></label
                    >
                  </div>
                </details>
              </div>
            </section>
            <section class="section" aria-labelledby="reading-title">
              <div class="section-heading">
                <span class="section-number" aria-hidden="true">02</span>
                <div>
                  <h2 id="reading-title">阅读偏好</h2>
                </div>
              </div>
              <div class="section-body">
                <label class="field language-field"
                  >翻译为<select id="target-language"></select
                ></label>
              </div>
            </section>
            <section class="section" aria-labelledby="data-title">
              <div class="section-heading">
                <span class="section-number" aria-hidden="true">03</span>
                <div>
                  <h2 id="data-title">缓存与费用</h2>
                </div>
              </div>
              <div class="section-body">
                <label class="check-row"
                  ><input id="persistent-cache" type="checkbox" /><span
                    >持久缓存</span
                  ></label
                >
                <div class="field-grid compact-grid">
                  <label class="field"
                    >缓存保留天数<input
                      id="cache-days"
                      type="number"
                      min="1"
                      max="30"
                      step="1"
                      required
                  /></label>
                  <label class="field"
                    >月度费用上限（USD）<input
                      id="monthly-budget"
                      type="number"
                      min="0"
                      max="10000"
                      step="0.01"
                      required
                  /></label>
                </div>
                <details class="advanced">
                  <summary>计费估算与单页限制</summary>
                  <div class="detail-body">
                    <div class="field-grid">
                      <label class="field"
                        >输入价格 / 百万 token（USD）<input
                          id="input-price"
                          type="number"
                          min="0"
                          max="10000"
                          step="0.001"
                          required /></label
                      ><label class="field"
                        >输出价格 / 百万 token（USD）<input
                          id="output-price"
                          type="number"
                          min="0"
                          max="10000"
                          step="0.001"
                          required
                      /></label>
                    </div>
                    <label class="field language-field"
                      >单页 token 上限<input
                        id="page-token-limit"
                        type="number"
                        min="0"
                        max="10000000"
                        step="1"
                        required
                    /></label>
                  </div>
                </details>
              </div>
            </section>
            <div class="actions">
              <p id="form-status" role="status" aria-live="polite"></p>
              <div class="action-buttons">
                <button
                  id="test-connection"
                  type="button"
                  class="button secondary"
                >
                  测试连接</button
                ><button
                  id="save-settings"
                  type="submit"
                  class="button primary"
                >
                  保存设置
                </button>
              </div>
            </div>
          </fieldset>
        </form>
        <section class="usage-section" aria-labelledby="usage-title">
          <div class="usage-heading">
            <h2 id="usage-title">本月用量</h2>
            <button id="refresh-usage" type="button" class="text-button">
              刷新用量
            </button>
          </div>
          <dl class="usage-grid">
            <div>
              <dt>预计费用</dt>
              <dd id="usage-cost">—</dd>
            </div>
            <div>
              <dt>输入 / 输出 token</dt>
              <dd id="usage-tokens">—</dd>
            </div>
            <div>
              <dt>请求 / 缓存命中</dt>
              <dd id="usage-requests">—</dd>
            </div>
          </dl>
          <p id="usage-note" class="usage-status" role="status"></p>
          <div class="cache-actions">
            <span id="cache-count">—</span
            ><button id="clear-cache" type="button" class="text-button">
              清除译文缓存
            </button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
